name = "bdlminer-chat"
main = "rust/build/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# The room: its messages and bans in SQLite, its WebSockets hibernating.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[observability]
enabled = true

[build]
command = "worker-build --release rust"
watch_dir = "rust/src"
